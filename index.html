<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damian Torres — Coach de Entrenamiento</title>
<meta name="description" content="Entrenamiento personalizado, presencial y a distancia. Rutinas a tu medida, seguimiento real y corrección de técnica.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="#top" class="nav__brand" id="navBrand"></a>
    <nav class="nav__links" id="navLinks">
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#paquetes">Paquetes</a>
      <a href="#rutina">Rutinas</a>
      <a href="#suplementos">Suplementos</a>
      <a href="#contacto">Contacto</a>
    </nav>
    <a href="#" class="btn btn--primary btn--sm" id="navCta">WhatsApp</a>
    <button class="nav__toggle" id="navToggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 class="hero__headline" id="heroHeadline"></h1>
      <p class="hero__sub" id="heroSub"></p>
      <div class="hero__ctas">
        <a href="#" class="btn btn--primary" id="heroCtaPrimary"></a>
        <a href="#paquetes" class="btn btn--ghost" id="heroCtaSecondary"></a>
      </div>
      <div class="hero__stats" id="heroStats"></div>
    </div>
  </section>

  <!-- ============ SOBRE MÍ ============ -->
  <section class="section" id="sobre-mi">
    <div class="section__inner">
      <div class="about__intro">
        <h2 id="aboutTitle"></h2>
        <p id="aboutText"></p>
      </div>
      <div class="about__pillars" id="aboutPillars"></div>
    </div>
  </section>

  <!-- ============ PAQUETES ============ -->
  <section class="section section--alt" id="paquetes">
    <div class="section__inner">
      <p class="section__eyebrow">Paquetes</p>
      <h2 class="section__title">Elige cómo quieres entrenar.</h2>
      <div class="packages" id="packagesGrid"></div>
    </div>
  </section>

  <!-- ============ RUTINA PREVIEW ============ -->
  <section class="section" id="rutina">
    <div class="section__inner section__inner--split">
      <div class="routine__copy">
        <p class="section__eyebrow">Cómo trabajo</p>
        <h2 id="routineTitle"></h2>
        <p id="routineText"></p>
      </div>
      <div class="routine__card" id="routineCard"></div>
    </div>
  </section>

  <!-- ============ SUPLEMENTOS ============ -->
  <section class="section section--alt" id="suplementos">
    <div class="section__inner section__inner--center">
      <p class="section__eyebrow">Próximamente</p>
      <h2 id="supplementsTitle"></h2>
      <p id="supplementsText"></p>
    </div>
  </section>

  <!-- ============ CONTACTO ============ -->
  <section class="section contact" id="contacto">
    <div class="section__inner section__inner--center">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <a href="#" class="btn btn--primary btn--lg" id="contactWhatsapp"></a>
      <div class="contact__socials" id="contactSocials"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer__inner">
    <span id="footerBrand"></span>
    <span id="footerText"></span>
  </div>
</footer>

</a>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
