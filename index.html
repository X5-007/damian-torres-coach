<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damian Torres — Coach de Entrenamiento</title>
<meta name="description" content="Entrenamiento personalizado, presencial y a distancia. Rutinas a tu medida, seguimiento real y corrección de técnica.">
<meta name="theme-color" content="#171512">

<meta property="og:type" content="website">
<meta property="og:title" content="Damian Torres — Coach de Entrenamiento">
<meta property="og:description" content="Entrenamiento personalizado, presencial y a distancia. Rutinas a tu medida, seguimiento real y corrección de técnica.">
<meta property="og:image" content="img/perfil.png">

<link rel="icon" href="img/perfil.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#top" class="skip-link">Saltar al contenido</a>

<!-- ============================================================
     NAV
     ============================================================ -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="#top" class="nav__brand-link">
      <span class="nav__avatar-wrap">
        <img src="img/perfil.png" alt="" class="nav__avatar">
      </span>
      <span class="nav__brand-text">
        <span class="nav__brand" id="navBrand"></span>
        <span class="nav__role" id="navRole"></span>
      </span>
    </a>

    <nav class="nav__links" id="navLinks" aria-label="Navegación principal">
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#paquetes">Paquetes</a>
      <a href="#juego">Tu plan</a>
      <a href="#rutina">Rutinas</a>
      <a href="#suplementos">Suplementos</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <a href="#" class="btn btn--primary btn--sm nav__cta" id="navCta">WhatsApp</a>

    <button class="nav__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- ============================================================
       HERO
       ============================================================ -->
  <section class="hero">
    <span class="hero__wash" aria-hidden="true"></span>

    <div class="hero__grid">
      <div class="hero__content reveal">
        <p class="eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span><span id="heroEyebrow"></span></p>
        <h1 class="hero__headline" id="heroHeadline"></h1>
        <p class="hero__sub" id="heroSub"></p>

        <div class="hero__ctas">
          <a href="#" class="btn btn--primary btn--lg" id="heroCtaPrimary"></a>
          <a href="#paquetes" class="btn btn--outline btn--lg" id="heroCtaSecondary"></a>
        </div>

        <ul class="hero__stats" id="heroStats"></ul>
      </div>

      <figure class="hero__media reveal reveal--delay">
        <span class="hero__media-frame" aria-hidden="true"></span>
        <div class="hero__media-img">
          <img src="img/hero-bg.jpg" alt="Damian Torres entrenando en el gimnasio" loading="eager">
        </div>
        <figcaption class="hero__badge">
          <img src="img/perfil.png" alt="" class="hero__badge-avatar">
          <span class="hero__badge-text">
            <strong id="heroBadgeName"></strong>
            <small id="heroBadgeRole"></small>
          </span>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- ============================================================
       TIRA DE VALORES
       ============================================================ -->
  <div class="strip" aria-hidden="true">
    <div class="strip__track" id="stripTrack"></div>
  </div>

  <!-- ============================================================
       SOBRE MÍ
       ============================================================ -->
  <section class="section" id="sobre-mi">
    <div class="container">
      <div class="about__grid">
        <figure class="about__portrait reveal">
          <img src="img/perfil.png" alt="Retrato de Damian Torres">
          <span class="about__portrait-frame" aria-hidden="true"></span>
        </figure>

        <div class="about__body reveal reveal--delay">
          <p class="section__eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span>Sobre mí</p>
          <h2 class="section__title" id="aboutTitle"></h2>
          <p class="lead" id="aboutText"></p>
        </div>
      </div>

      <div class="pillars" id="aboutPillars"></div>
    </div>
  </section>

  <!-- ============================================================
       PAQUETES
       ============================================================ -->
  <section class="section section--alt" id="paquetes">
    <div class="container">
      <header class="section__head reveal">
        <p class="section__eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span>Paquetes</p>
        <h2 class="section__title section__title--lg">Elige cómo quieres entrenar.</h2>
      </header>

      <div class="packages" id="packagesGrid"></div>
    </div>
  </section>

  <!-- ============================================================
       MÉTODO / RUTINA
       ============================================================ -->
  <section class="section" id="rutina">
    <div class="container">
      <div class="routine__grid">
        <div class="routine__copy reveal">
          <p class="section__eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span>Cómo trabajo</p>
          <h2 class="section__title" id="routineTitle"></h2>
          <p class="lead" id="routineText"></p>
          <a href="#contacto" class="link-arrow">Hablemos de tu plan
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>

        <div class="routine__card reveal reveal--delay" id="routineCard"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       JUEGO — DESCUBRE TU PLAN
       ============================================================ -->
  <section class="section section--ink" id="juego">
    <div class="container">
      <header class="section__head section__head--center reveal">
        <p class="section__eyebrow section__eyebrow--center">Interactivo</p>
        <h2 class="section__title section__title--lg" id="gameTitle"></h2>
        <p class="lead" id="gameIntro"></p>
      </header>

      <div class="swipe reveal" id="swipeApp">
        <div class="swipe__stack" id="swipeStack"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       SUPLEMENTOS
       ============================================================ -->
  <section class="section" id="suplementos">
    <div class="container">
      <div class="supplements reveal">
        <span class="badge" id="supplementsBadge">Próximamente</span>
        <h2 class="section__title" id="supplementsTitle"></h2>
        <p class="lead" id="supplementsText"></p>
        <a class="btn btn--ink supplements__cta" id="supplementsCta" href="#" hidden></a>
      </div>
    </div>
  </section>

  <!-- ============================================================
       CONTACTO
       ============================================================ -->
  <section class="section section--ink contact" id="contacto">
    <div class="container">
      <div class="contact__grid">
        <div class="contact__copy reveal">
          <p class="section__eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span>Contacto</p>
          <h2 class="contact__title" id="contactTitle"></h2>
          <p class="lead" id="contactText"></p>
          <a href="#" class="btn btn--primary btn--lg" id="contactWhatsapp"></a>
        </div>

        <div class="contact__socials reveal reveal--delay" id="contactSocials"></div>
      </div>
    </div>
  </section>

</main>

<!-- ============================================================
     FOOTER
     ============================================================ -->
<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <span class="footer__mark" id="footerInitials"></span>
      <div>
        <strong id="footerBrand"></strong>
        <p id="footerText"></p>
      </div>
    </div>

    <nav class="footer__links" aria-label="Navegación del pie">
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#paquetes">Paquetes</a>
      <a href="#juego">Tu plan</a>
      <a href="#rutina">Rutinas</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
  <div class="container footer__bottom">
    <span id="footerCopy"></span>
    <span id="footerPhone"></span>
  </div>
</footer>

<!-- ============================================================
     BOTONES FLOTANTES
     ============================================================ -->
<div class="fabs">
  <a href="#juego" class="fab fab--game" id="gameFab">
    <span class="fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/></svg>
    </span>
    <span class="fab__text" id="gameFabText"></span>
  </a>

  <a href="#" class="fab fab--wa" id="whatsappFab" aria-label="Escribir por WhatsApp">
    <svg viewBox="0 0 32 32" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.3.63 4.44 1.72 6.28L4 29l7.9-1.66a12 12 0 0 0 4.12.73h.01c6.62 0 12.02-5.4 12.02-12.02C28.05 8.4 22.65 3 16.02 3zm0 21.86h-.01a9.9 9.9 0 0 1-5.05-1.38l-.36-.21-3.75.79.8-3.66-.24-.38a9.86 9.86 0 0 1-1.51-5.2c0-5.46 4.45-9.9 9.93-9.9 2.65 0 5.14 1.03 7.01 2.9a9.85 9.85 0 0 1 2.9 7.01c0 5.47-4.45 9.93-9.72 9.93zm5.44-7.43c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.04-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.02-1.04 2.48 1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>
  </a>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
