<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjetas de paquetes — Damian Torres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TARJETAS DE PAQUETES PARA COMPARTIR (1080 x 1080)
   Mismo sistema de diseño que el sitio: papel cálido, tinta, arcilla y bronce.
   Para regenerar los JPG: node marketing/render.mjs
   ========================================================================= */
:root {
  --paper:      #f7f4ef;
  --paper-card: #fffdfa;
  --ink:        #171512;
  --ink-card:   #201d19;
  --text:       #1d1a16;
  --text-soft:  #5c554b;
  --text-mute:  #8b8377;
  --line:       #e3dbcf;
  --clay:       #b23a2e;
  --bronze:     #a97b3f;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #6b6b6b; font-family: var(--font-body); display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px; }

.board {
  --bg: var(--paper);
  --card: var(--paper-card);
  --accent: var(--clay);
  --fg: var(--text);
  --fg-soft: var(--text-soft);
  --fg-mute: var(--text-mute);
  --hair: var(--line);
  --ghost: rgba(23, 21, 18, 0.05);

  position: relative;
  width: 1080px;
  height: 1080px;
  flex: none;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  padding: 60px 64px 56px;
  display: flex;
  flex-direction: column;
}

.board--gold { --accent: var(--bronze); }
.board--ink {
  --bg: var(--ink);
  --card: var(--ink-card);
  --accent: var(--bronze);
  --fg: #f3efe8;
  --fg-soft: rgba(243, 239, 232, 0.72);
  --fg-mute: rgba(243, 239, 232, 0.46);
  --hair: rgba(247, 244, 239, 0.14);
  --ghost: rgba(247, 244, 239, 0.045);
}

/* Resplandor de acento, como el hero del sitio */
.board::before {
  content: '';
  position: absolute;
  top: -280px;
  right: -220px;
  width: 940px;
  height: 940px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
}

/* Número gigante de fondo */
.ghost {
  position: absolute;
  top: -142px;
  right: -46px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 600px;
  line-height: 1;
  letter-spacing: -0.05em;
  color: var(--ghost);
  user-select: none;
}

/* Esquinas */
.corner {
  position: absolute;
  width: 54px;
  height: 54px;
  border: 2px solid var(--accent);
  opacity: 0.5;
}
.corner--tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
.corner--br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

.head, .intro, .panel, .foot { position: relative; z-index: 1; }

/* ---- Cabecera ---- */
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand__avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
  padding: 2px;
}
.brand__name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 23px;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.brand__role {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.head__index {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-mute);
}

/* ---- Titular ---- */
.intro { margin-top: 34px; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
}
.eyebrow::before {
  content: '';
  width: 34px;
  height: 2px;
  background: currentColor;
  opacity: 0.6;
}
.title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 66px;
  line-height: 1.03;
  letter-spacing: -0.032em;
  max-width: 15ch;
}
.title-rule {
  width: 62px;
  height: 3px;
  background: var(--accent);
  margin: 20px 0 18px;
}
.subtitle {
  font-size: 23px;
  line-height: 1.45;
  color: var(--fg-soft);
  max-width: 34ch;
}

/* ---- Panel de precio + beneficios ---- */
.panel {
  margin-top: auto;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 300px 1fr;
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.10);
}
.panel::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: var(--accent);
}
.panel__price { padding: 34px 28px 34px 36px; border-right: 1px solid var(--hair); }
.panel__list { padding: 28px 34px; display: flex; flex-direction: column; justify-content: center; }

.price__top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.badge {
  padding: 6px 13px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.price__unit {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--fg-mute);
}
.price__old {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500;
  color: var(--fg-mute);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  margin-bottom: 2px;
}
.price__now {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 88px;
  line-height: 0.98;
  letter-spacing: -0.04em;
  margin-bottom: 14px;
}
.price__label {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--accent);
}

.feature {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  font-size: 21px;
  line-height: 1.38;
  font-weight: 500;
  color: var(--fg);
  padding: 6px 0;
}
.feature svg {
  width: 21px;
  height: 21px;
  flex: none;
  margin-top: 4px;
  color: var(--accent);
}

/* ---- Cierre ---- */
.foot { margin-top: 32px; text-align: center; }
.tagline {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin-bottom: 20px;
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 19px 44px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 31px;
  font-weight: 700;
  letter-spacing: 0.03em;
  box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 34%, transparent);
}
.cta svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<div id="boards"></div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const PHONE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>';

const PAQUETES = [
  {
    theme: '',
    num: '01',
    tag: 'Rutina enfocada',
    title: 'Rutina Enfocada',

    discount: '-24%',

    ],
    tagline: 'Empieza fuerte, con un plan hecho para ti',
  },
  {
    theme: 'board--gold',
    num: '02',
    tag: 'Entrenamiento a distancia',
    title: 'A Distancia, pero enfocado',
    subtitle: 'Seguimiento constante durante 1 mes completo.',
    discount: '-17%',
    unit: '1 mes',
    oldPrice: '$599',
    price: '$499',
    priceLabel: 'Mensual',
    features: [
      'Asesoramiento inicial',
      'Rutina personalizada',
      'Revisión cada 2 semanas',
      'Atención por línea 1 mes',
      'Entrenamiento dinámico',
      'Seguimiento de progreso',
      'Corrección de técnica',
      'Recomendación suplementaria',
    ],
    tagline: 'Resultados constantes, sin importar la distancia',
  },
  {
    theme: '',
    num: '03',
    tag: 'Entrenamiento personal',
    title: 'Entrenamiento Personal',
    subtitle: 'Enfoque 100% en ti, 5 días a la semana.',
    discount: '-20%',
    unit: 'Semanal',
    oldPrice: '$999',
    price: '$799',
    priceLabel: 'Entrenamiento personal',
    features: [
      'Asesoramiento inicial',

      '5 días/semana · 2hrs por sesión',

    ],

  {

      'Asesoramiento inicial + atención prioritaria',
      '5 días/semana · 2hrs por sesión',
      'Voy a tu gimnasio más cercano',
      'Rutina personalizada',
      'Corrección de técnica en vivo',
      'Atención en línea 24hrs, toda la semana',
      'Medición y progreso durante 3 meses',
      'Sugerencias alimenticias (no dieta)',
    ],
    tagline: 'La experiencia VIP para tu mejor versión',
  },
];

const BRAND = { name: 'Damian Torres', role: 'Coach de entrenamiento', phone: '313 - 153 - 6627' };

document.getElementById('boards').innerHTML = PAQUETES.map((p, i) => `
  <section class="board ${p.theme}" id="board-${p.num}">
    <span class="ghost">${p.num}</span>
    <span class="corner corner--tl"></span>
    <span class="corner corner--br"></span>

    <header class="head">
      <div class="brand">
        <img class="brand__avatar" src="../img/perfil.png" alt="">
        <div>
          <div class="brand__name">${BRAND.name}</div>
          <div class="brand__role">${BRAND.role}</div>
        </div>
      </div>
      <div class="head__index">Paquete ${p.num} / 0${PAQUETES.length}</div>
    </header>

    <div class="intro">
      <p class="eyebrow">${p.tag}</p>
      <h1 class="title">${p.title}</h1>
      <div class="title-rule"></div>
      <p class="subtitle">${p.subtitle}</p>
    </div>

    <div class="panel">
      <div class="panel__price">
        <div class="price__top">
          <span class="badge">${p.discount}</span>
          <span class="price__unit">${p.unit}</span>
        </div>
        <div class="price__old">${p.oldPrice}</div>
        <div class="price__now">${p.price}</div>
        <div class="price__label">${p.priceLabel}</div>
      </div>
      <div class="panel__list">
        ${p.features.map((f) => `<div class="feature">${CHECK}<span>${f}</span></div>`).join('')}
      </div>
    </div>

    <footer class="foot">
      <p class="tagline">${p.tagline}</p>
      <span class="cta">${PHONE}${BRAND.phone}</span>
    </footer>
  </section>
`).join('');
</script>
</body>
</html>
